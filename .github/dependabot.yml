version: 2
# No `target-branch`: develop is the default branch, and setting it makes security updates
# ignore every option below (groups, ignore, labels).
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: 1
      time: "00:01"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      github-actions-deps:
        applies-to: version-updates
        patterns:
          - "*"

  # All deps for the monorepo root (prod + dev, including toolchain).
  # Prod bumps are committed as `fix(deps):` so the release pipeline's conventional-commit
  # analyzer picks them up and bumps the packages that consume them; dev bumps stay as `chore`.
  # Override the PR title manually when a bump shouldn't trigger a release (e.g. toolchain-only).
  # Note: Dependabot does not allow two npm entries for the same directory,
  # so per-group commit prefixes are not possible — keep this as a single entry.
  - package-ecosystem: "npm"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "monthly"
      day: 1
      time: "00:01"
      timezone: "UTC"
    labels:
      - "dependencies"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    groups:
      npm-dev-deps:
        applies-to: version-updates
        patterns:
          - "*"
        dependency-type: "development"

      npm-prod-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
        dependency-type: "production"

      npm-prod-major-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
        dependency-type: "production"

    # Majors blocked upstream; drop each rule once its blocker clears.
    ignore:
      # @rollup/plugin-babel peers @babel/core ^7; plugin-transform-object-assign has no 8.x
      - dependency-name: "@babel/*"
        update-types:
          - version-update:semver-major
      # typescript-eslint, ts-jest and @swc-node/register cap TypeScript below 7
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
      # msw 3 is ESM-only; Jest 30 would need --experimental-vm-modules
      - dependency-name: "msw"
        update-types:
          - version-update:semver-major
      # @jscutlery/semver still expects the v7 preset
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types:
          - version-update:semver-major

  # Sample applications (excluding gatsby), one entry per framework so a failing app
  # only blocks its own framework's PR. Monthly, with majors split out.
  # Angular sample apps
  - package-ecosystem: "npm"
    cooldown:
      default-days: 7
    directories:
      - "/examples/angular/sample-app"
    schedule:
      interval: "monthly"
      day: 1
      time: "00:01"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "sample-apps"
    open-pull-requests-limit: 0
    groups:
      angular-sample-apps-npm-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

      angular-sample-apps-npm-major-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"

    ignore:
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major

