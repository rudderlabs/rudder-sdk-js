name: Check PR Title

on:
  pull_request:
    branches: ['main', 'develop', 'hotfix/*']
    types: ['opened', 'reopened', 'edited', 'synchronize']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check_pr_title:
    name: Check PR title
    # Fork PRs trigger this job, so it runs on a GitHub-hosted runner, not ARC.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # v2 reads the title from the event payload, so the job needs no token.
    permissions: {}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check PR title
        uses: rudderlabs/github-action-check-pr-title@3967756a96b89133e6cd700a8384a1e2b95cb21c # v2.0.3
        with:
          subjectPattern: ^(?![A-Z]).+$
