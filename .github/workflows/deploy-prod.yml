name: Deploy to Production Environment

# Runs on push to main, not on pull_request, so the prod deploy role can trust
# only refs/heads/main: main's ruleset is the gate, and no PR in any repo can
# assume the role. Non-release pushes are skipped in get-deploy-inputs.
on:
  push:
    branches: ['main']

# A production deploy must never be pre-empted, and two of them must never
# overlap. The deploy job uploads the pinned plugin directory before it
# overwrites the core at /v3, so a run that is cancelled part way through --
# or overtaken by a second release -- can leave a live core pointing at an
# incomplete pinned plugin directory, a state no invalidation repairs. A
# queued run is strictly safer than a truncated or racing one.
#
# The group is deliberately constant so it also queues against rollback.yml,
# which runs from tags as well as main.
concurrency:
  # Shared with rollback.yml: both write the same production /v3 paths and
  # invalidate the same distribution, so they have to queue against each
  # other and not just against themselves. A literal rather than
  # github.workflow, which differs per workflow and would split the group.
  group: production-cdn-write
  cancel-in-progress: false

permissions: {}

jobs:
  get-deploy-inputs:
    name: Get Deploy Inputs
    runs-on: arc-amd64
    outputs:
      is_release: ${{ steps.release-info.outputs.is_release }}
      trigger_source: ${{ steps.release-info.outputs.trigger_source }}
      release_version: ${{ steps.release-info.outputs.release_version }}
      release_ticket_id: ${{ steps.release-info.outputs.release_ticket_id }}
    permissions:
      contents: read # actions/checkout
      pull-requests: read # look up the PR this push merged
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      # Only a merged release or hotfix-release PR deploys. The version comes
      # from the merged package.json; the ticket from the PR's branch.
      - name: Resolve release info
        id: release-info
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          ACTOR: ${{ github.actor }}
        run: |
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq "[.[] | select(.base.ref == \"main\" and .merged_at != null and .merge_commit_sha == \"$SHA\")][0] // empty")
          branch=$(jq -r '.head.ref // empty' <<< "$pr")
          echo "PR branch: ${branch:-<none>}"

          if [[ "$branch" != release/* && "$branch" != hotfix-release/* ]]; then
            echo "Not a release merge; skipping the production deploy."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(jq -r .version package.json)
          # Branch format: release/3.2.1-SDK-1234 or hotfix-release/3.2.2-SDK-5678
          ticket=$(sed -n 's|.*[0-9]\+-\(.*\)$|\1|p' <<< "$branch")
          pr_url=$(jq -r .html_url <<< "$pr")
          pr_number=$(jq -r .number <<< "$pr")
          echo "Version: $version, ticket: $ticket"

          {
            echo "is_release=true"
            echo "release_version=$version"
            echo "release_ticket_id=$ticket"
            echo "trigger_source=PR <${pr_url}|#${pr_number}> merged by <${SERVER_URL}/${ACTOR}|${ACTOR}>"
          } >> "$GITHUB_OUTPUT"

  deploy:
    permissions:
      contents: read
      id-token: write
    name: Deploy to production environment
    needs: [get-deploy-inputs]
    if: needs.get-deploy-inputs.outputs.is_release == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: 'production'
      bugsnag_release_stage: 'production'
      s3_dir_path: 'v3'
      s3_dir_path_legacy: 'v1.1'
      trigger_source: ${{ needs.get-deploy-inputs.outputs.trigger_source }}
      monorepo_release_version: ${{ needs.get-deploy-inputs.outputs.release_version }}
      release_ticket_id: ${{ needs.get-deploy-inputs.outputs.release_ticket_id }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_PROD_ACCOUNT_ID }}
      AWS_S3_BUCKET_NAME: ${{ secrets.AWS_PROD_S3_BUCKET_NAME }}
      AWS_S3_SYNC_ROLE: ${{ secrets.AWS_PROD_S3_SYNC_ROLE }}
      AWS_CF_DISTRIBUTION_ID: ${{ secrets.AWS_PROD_CF_DISTRIBUTION_ID }}
      BUGSNAG_API_KEY: ${{ secrets.RS_PROD_BUGSNAG_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_RELEASE_CHANNEL_ID: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
      RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}

  deploy-sanity-suite:
    permissions:
      contents: read
      id-token: write
    name: Deploy sanity suite
    needs: [get-deploy-inputs]
    if: needs.get-deploy-inputs.outputs.is_release == 'true'
    uses: ./.github/workflows/deploy-sanity-suite.yml
    with:
      environment: 'production'
      trigger_source: ${{ needs.get-deploy-inputs.outputs.trigger_source }}
      monorepo_release_version: ${{ needs.get-deploy-inputs.outputs.release_version }}
      release_ticket_id: ${{ needs.get-deploy-inputs.outputs.release_ticket_id }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_PROD_ACCOUNT_ID }}
      AWS_S3_BUCKET_NAME: ${{ secrets.AWS_PROD_S3_BUCKET_NAME }}
      AWS_S3_SYNC_ROLE: ${{ secrets.AWS_PROD_S3_SYNC_ROLE }}
      AWS_CF_DISTRIBUTION_ID: ${{ secrets.AWS_PROD_CF_DISTRIBUTION_ID }}
      SANITY_SUITE_WRITE_KEY: ${{ secrets.SANITY_SUITE_PROD_WRITE_KEY }}
      SANITY_SUITE_DATAPLANE_URL: ${{ secrets.SANITY_SUITE_PROD_DATAPLANE_URL }}
      SANITY_SUITE_CONFIG_SERVER_HOST: ${{ secrets.SANITY_SUITE_PROD_CONFIG_SERVER_HOST }}
      BUGSNAG_API_KEY: ${{ secrets.RS_PROD_BUGSNAG_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_RELEASE_CHANNEL_ID: ${{ secrets.SLACK_RELEASE_CHANNEL_ID_NON_PROD }}
      RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}

  run-e2e-regression-test-suites:
    permissions:
      contents: read # run-e2e-regression-test-suites.yml: actions/checkout
    uses: ./.github/workflows/run-e2e-regression-test-suites.yml
    name: Run E2E Regression Test Suites
    needs: [get-deploy-inputs, deploy-sanity-suite, deploy]
    with:
      trigger_source: ${{ needs.get-deploy-inputs.outputs.trigger_source }}
      environment: production
      monorepo_release_version: ${{ needs.get-deploy-inputs.outputs.release_version }}
      release_ticket_id: ${{ needs.get-deploy-inputs.outputs.release_ticket_id }}
    secrets:
      RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
