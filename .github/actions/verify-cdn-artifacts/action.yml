name: 'Verify CDN Artifacts'
description: 'Asserts that the selected published SDK artifacts are reachable on the CDN, with an optional bounded retry window'

inputs:
  base_cdn_url:
    description: 'Base CDN URL the artifacts are published under'
    required: true
  verify_core:
    description: 'Verify the core bundle, at the versioned prefix when sdk_version is set and at the floating prefix when s3_dir_path is set'
    required: false
    default: 'false'
  verify_plugins:
    description: 'Verify the plugins published under <base_cdn_url>/<sdk_version>/modern/plugins'
    required: false
    default: 'false'
  verify_integrations:
    description: 'Verify the legacy and modern integrations published under <base_cdn_url>/<sdk_version>'
    required: false
    default: 'false'
  sdk_version:
    description: 'Versioned CDN directory. Required by verify_plugins and verify_integrations.'
    required: false
    default: ''
  s3_dir_path:
    description: 'Floating CDN directory. Used by verify_core.'
    required: false
    default: ''
  plugins_src:
    description: 'Local directory of built plugin artifacts. When set, every *.js in it is verified too, which also catches an artifact that was built but never uploaded.'
    required: false
    default: ''
  listing_file:
    description: 'Generated listing each recursive upload writes last. Must match INTEGRATIONS_HTML_FILE / PLUGINS_HTML_FILE in deploy.yml.'
    required: false
    default: 'list.html'
  request_timeout_seconds:
    description: 'Ceiling on a single artifact request, retries included. Also capped by whatever is left of timeout_seconds.'
    required: false
    default: '30'
  timeout_seconds:
    description: 'How long to keep retrying artifacts that are not reachable yet. 0 checks once and fails.'
    required: false
    default: '0'
  poll_interval_seconds:
    description: 'Delay between retries'
    required: false
    default: '20'

runs:
  using: 'composite'
  steps:
    - name: Verify the artifacts are reachable
      shell: bash
      env:
        BASE_CDN_URL: ${{ inputs.base_cdn_url }}
        VERIFY_CORE: ${{ inputs.verify_core }}
        VERIFY_PLUGINS: ${{ inputs.verify_plugins }}
        VERIFY_INTEGRATIONS: ${{ inputs.verify_integrations }}
        SDK_VERSION: ${{ inputs.sdk_version }}
        S3_DIR_PATH: ${{ inputs.s3_dir_path }}
        PLUGINS_SRC: ${{ inputs.plugins_src }}
        LISTING_FILE: ${{ inputs.listing_file }}
        REQUEST_TIMEOUT_SECONDS: ${{ inputs.request_timeout_seconds }}
        TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        POLL_INTERVAL_SECONDS: ${{ inputs.poll_interval_seconds }}
      run: |
        selected=()
        invalid=0

        if [ "$VERIFY_CORE" = "true" ]; then
          selected+=("core")
          [ -n "$SDK_VERSION" ] || [ -n "$S3_DIR_PATH" ] || { echo "::error::verify_core requires sdk_version or s3_dir_path"; invalid=1; }
        fi

        if [ "$VERIFY_PLUGINS" = "true" ]; then
          selected+=("plugins")
          [ -n "$SDK_VERSION" ] || { echo "::error::verify_plugins requires sdk_version"; invalid=1; }
        fi

        if [ "$VERIFY_INTEGRATIONS" = "true" ]; then
          selected+=("integrations")
          [ -n "$SDK_VERSION" ] || { echo "::error::verify_integrations requires sdk_version"; invalid=1; }
        fi

        if [ "${#selected[@]}" -eq 0 ]; then
          echo "::error::Set at least one of verify_core, verify_plugins, verify_integrations"
          exit 1
        fi

        [ "$invalid" -eq 0 ] || exit 1

        echo "Verifying: ${selected[*]}"

        deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))
        # Scoped to the run, not to each wait_for_urls call. The first pass is
        # exempt from the deadline so the log can name every missing artifact,
        # and this phase is called once per artifact group -- keeping the flag
        # local would hand each group its own uncapped pass and timeout_seconds
        # would stop being an upper bound on the run.
        first_pass=1

        # Retries only the URLs that are still unreachable, so a slow artifact
        # does not re-fetch the ones that already answered.
        # $1 is a regex the response body must also match, or '' for a plain
        # reachability check.
        wait_for_urls() {
          local match=$1
          shift
          local urls=("$@")
          local pending url status out reason remaining budget

          while :; do
            pending=()

            for url in "${urls[@]}"; do
              remaining=$(( deadline - $(date +%s) ))

              # The first pass always runs to completion, so the log names every
              # missing artifact rather than whichever one ran the clock out.
              # After that nothing new starts once the budget is spent, and no
              # single request may outlive what is left of it -- otherwise a
              # directory full of unreachable files walks past the deadline one
              # request at a time before it is ever consulted.
              if [ "$first_pass" -eq 0 ] && [ "$remaining" -le 0 ]; then
                pending+=("$url")
                continue
              fi

              budget="$REQUEST_TIMEOUT_SECONDS"

              if [ "$first_pass" -eq 0 ] && [ "$remaining" -lt "$budget" ]; then
                budget="$remaining"
              fi

              if [ -n "$match" ]; then
                out=$(mktemp)
              else
                out=/dev/null
              fi

              status=$(curl -sS -o "$out" -w '%{http_code}' --retry 2 --retry-delay 5 --retry-max-time "$budget" --max-time "$budget" "$url" || echo '000')
              reason=""

              if [ "$status" != "200" ]; then
                reason="returned $status"
              elif [ -n "$match" ] && ! grep -qE -- "$match" "$out"; then
                reason="is served but is not this release's build"
              fi

              [ "$out" = /dev/null ] || rm -f "$out"

              if [ -z "$reason" ]; then
                echo "ok  $status  $url"
              else
                echo "$url $reason"
                pending+=("$url")
              fi
            done

            first_pass=0

            if [ "${#pending[@]}" -eq 0 ]; then
              return 0
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              for url in "${pending[@]}"; do
                echo "::error::$url is not the published artifact this release expects"
              done
              return 1
            fi

            echo "${#pending[@]} artifact(s) not reachable yet; retrying in ${POLL_INTERVAL_SECONDS}s"
            urls=("${pending[@]}")
            sleep "${POLL_INTERVAL_SECONDS}"
          done
        }

        markers=()
        listings=()
        cores=()

        # The core embeds its own version as a quoted string literal, so when the
        # caller names a version the core can be checked for identity rather
        # than mere presence. That matters because S3 never removes what an
        # earlier attempt left behind: a stale or partial version prefix answers
        # 200 for every URL here, and the floating path answers 200 with the
        # previous release whether or not this deploy got that far. deploy.yml
        # copies the core to the floating path only after its own per-file check
        # has passed, so a floating core that reports this version is also
        # evidence that the check passed.
        core_pattern=""

        if [ -n "$SDK_VERSION" ]; then
          core_pattern="['\"\`]$(printf '%s' "$SDK_VERSION" | sed 's/[][\\.*^$/]/\\&/g')['\"\`]"
        fi

        if [ "$VERIFY_CORE" = "true" ]; then
          if [ -n "$SDK_VERSION" ]; then
            cores+=("${BASE_CDN_URL}/${SDK_VERSION}/modern/rsa.min.js")
          fi

          if [ -n "$S3_DIR_PATH" ]; then
            if [ -n "$SDK_VERSION" ]; then
              cores+=("${BASE_CDN_URL}/${S3_DIR_PATH}/modern/rsa.min.js")
            else
              markers+=("${BASE_CDN_URL}/${S3_DIR_PATH}/modern/rsa.min.js")
            fi
          fi
        fi

        # Each listing is uploaded after the recursive upload of its directory
        # returns, so it marks that directory as populated, and it names every
        # object in it -- which is how the per-file check below finds them
        # without a local build to enumerate.
        if [ "$VERIFY_PLUGINS" = "true" ]; then
          listings+=("${BASE_CDN_URL}/${SDK_VERSION}/modern/plugins/${LISTING_FILE}")
        fi

        if [ "$VERIFY_INTEGRATIONS" = "true" ]; then
          for variant in legacy modern; do
            listings+=("${BASE_CDN_URL}/${SDK_VERSION}/${variant}/js-integrations/${LISTING_FILE}")
          done
        fi

        # Every built entry point and chunk, not just the remote ones: a missing
        # shared chunk breaks the remote plugins that import it. Enumerating the
        # build output as well as the listing catches an artifact that was built
        # but never uploaded, which the listing alone cannot see.
        if [ -n "$PLUGINS_SRC" ]; then
          for artifact in "${PLUGINS_SRC}"/*.js; do
            markers+=("${BASE_CDN_URL}/${SDK_VERSION}/modern/plugins/$(basename "$artifact")")
          done
        fi

        wait_for_urls '' "${markers[@]}" "${listings[@]}" || exit 1

        if [ "${#cores[@]}" -gt 0 ]; then
          wait_for_urls "$core_pattern" "${cores[@]}" || exit 1
        fi

        listed=()

        for listing in "${listings[@]}"; do
          count=0

          # The listing is fetched to a file rather than piped straight into the
          # loop: in a process substitution curl's exit status is invisible, so a
          # response truncated after the first few links would leave count
          # nonzero and narrow the check to whatever arrived. That is the partial
          # upload this action exists to catch, so it has to be a hard failure.
          listing_body=$(mktemp)

          # A listing may not outlive what is left of the deadline; without this a
          # run with many listings walks past timeout_seconds one fetch at a time.
          # Only applies when there is a retry budget to spend: timeout_seconds: 0
          # means "check once", and by this point the marker pass has already
          # cleared first_pass, so gating on the deadline would fail every
          # deploy-time call before it issued a request.
          listing_remaining=$(( deadline - $(date +%s) ))
          listing_budget="$REQUEST_TIMEOUT_SECONDS"

          if [ "$TIMEOUT_SECONDS" -gt 0 ] && [ "$first_pass" -eq 0 ]; then
            if [ "$listing_remaining" -le 0 ]; then
              rm -f "$listing_body"
              echo "::error::Ran out of time before downloading ${listing}"
              exit 1
            fi

            if [ "$listing_remaining" -lt "$listing_budget" ]; then
              listing_budget="$listing_remaining"
            fi
          fi

          if ! curl -fsS --retry 2 --retry-delay 5 --retry-max-time "$listing_budget" --max-time "$listing_budget" -o "$listing_body" "$listing"; then
            rm -f "$listing_body"
            echo "::error::Failed to download ${listing}"
            exit 1
          fi

          while IFS= read -r url; do
            [ -n "$url" ] || continue
            listed+=("$url")
            count=$(( count + 1 ))
          done < <(grep -oE 'href="[^"]+\.js"' "$listing_body" | sed -e 's/^href="//' -e 's/"$//' | sort -u)

          rm -f "$listing_body"

          if [ "$count" -eq 0 ]; then
            echo "::error::${listing} names no JavaScript artifacts"
            exit 1
          fi

          echo "${listing} names ${count} JavaScript artifact(s)"
        done

        if [ "${#listed[@]}" -gt 0 ]; then
          wait_for_urls '' "${listed[@]}" || exit 1
        fi
