name: 'Release Thread Integration'
description: 'Downloads release info artifact and posts deployment messages to the original release thread'

inputs:
  monorepo_release_version:
    description: 'Monorepo release version for artifact lookup'
    required: true
  release_ticket_id:
    description: 'Release ticket for artifact lookup'
    required: true
  slack_bot_token:
    description: 'Slack bot token for posting messages'
    required: true
  title:
    description: 'Title for the Slack message (e.g., ":white_check_mark: JS SDK deployment completed")'
    required: true
  link_text:
    description: 'Text for the Slack message link (e.g., "View deployment details", "View test results")'
    required: false
    default: 'View details'
  slack_message_url:
    description: 'Slack message URL'
    required: false
  slack_api_response:
    description: 'JSON response from Slack API containing message details'
    required: false
  slack_slugs:
    description: 'Slack slugs for CC'
    required: false
    default: '<!subteam^S0555JBV36D> <!subteam^S03SW7DM8P3> <!subteam^S03SHJ20350>'
  custom_message:
    description: 'Custom message to post to the release thread'
    required: false
    default: ''

outputs:
  has_thread_info:
    description: 'Whether release thread info was found'
    value: ${{ steps.extract-info.outputs.has_thread_info }}
  channel_id:
    description: 'Slack channel ID from release artifact'
    value: ${{ steps.extract-info.outputs.channel_id }}
  thread_ts:
    description: 'Slack thread timestamp from release artifact'
    value: ${{ steps.extract-info.outputs.thread_ts }}
  pr_url:
    description: 'PR URL from release artifact'
    value: ${{ steps.extract-info.outputs.pr_url }}

runs:
  using: 'composite'
  steps:
    - name: Ensure jq is installed
      shell: bash
      run: |
        if ! command -v jq &> /dev/null; then
          echo "jq not found, installing..."
          if [[ "$OSTYPE" == "linux-gnu"* ]]; then
            # Linux - use apt-get (most common for GitHub runners)
            sudo apt-get update && sudo apt-get install -y jq
          elif [[ "$OSTYPE" == "darwin"* ]]; then
            # macOS - use brew if available, otherwise install via curl
            if command -v brew &> /dev/null; then
              brew install jq
            else
              # Fallback: install jq binary directly
              curl -L -o /usr/local/bin/jq https://github.com/stedolan/jq/releases/latest/download/jq-osx-amd64
              chmod +x /usr/local/bin/jq
            fi
          else
            echo "Unsupported OS type: $OSTYPE"
            exit 1
          fi
        else
          echo "jq is already installed"
          jq --version
        fi

    - name: Download release info artifact from original workflow
      id: download-release-info
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        ARTIFACT_NAME: release-info-v${{ inputs.monorepo_release_version }}-${{ inputs.release_ticket_id }}
      run: |
        mkdir -p release-info

        # Non-blocking, but visible: warn in the log and the run summary
        notice_failed() {
          echo "::warning title=Release thread notice skipped::$1"
          echo "- :warning: Release thread notice skipped: $1" >> "$GITHUB_STEP_SUMMARY"
        }

        echo "Searching for artifact: $ARTIFACT_NAME"

        # Look up by name across the repo; scanning recent draft runs missed older drafts and re-runs
        if ! artifacts_response=$(curl -fsS -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$REPO/actions/artifacts?name=$ARTIFACT_NAME&per_page=100"); then
          notice_failed "could not query artifacts API for $ARTIFACT_NAME"
          exit 0
        fi

        # Newest non-expired copy wins (re-runs of the draft upload duplicates)
        artifact_id=$(echo "$artifacts_response" | jq -r --arg name "$ARTIFACT_NAME" \
          '[.artifacts[] | select(.name == $name and (.expired | not))] | sort_by(.created_at) | last | .id // empty')

        if [ -z "$artifact_id" ]; then
          expired_count=$(echo "$artifacts_response" | jq -r --arg name "$ARTIFACT_NAME" \
            '[.artifacts[] | select(.name == $name and .expired)] | length')
          if [ "$expired_count" -gt 0 ]; then
            notice_failed "artifact $ARTIFACT_NAME has expired (see retention-days in draft-new-release.yml)"
          else
            notice_failed "artifact $ARTIFACT_NAME not found (never uploaded, purged after expiry, or version/ticket ID mismatch with the draft run)"
          fi
          exit 0
        fi

        echo "Found artifact $artifact_id"

        if ! curl -fsSL -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/$REPO/actions/artifacts/$artifact_id/zip" \
          -o release-info.zip; then
          notice_failed "failed to download artifact $ARTIFACT_NAME ($artifact_id)"
          exit 0
        fi

        if ! unzip -o release-info.zip -d release-info/; then
          notice_failed "failed to extract artifact $ARTIFACT_NAME ($artifact_id)"
          exit 0
        fi
        rm release-info.zip

        echo "Successfully downloaded and extracted artifact"

    - name: Extract release info
      id: extract-info
      continue-on-error: true
      shell: bash
      run: |
        if [ -f "release-info/release-info.json" ]; then
          echo "Found release info artifact"
          
          # Extract values from JSON
          channel_id=$(jq -r '.channel_id' release-info/release-info.json)
          thread_ts=$(jq -r '.thread_ts' release-info/release-info.json)
          pr_url=$(jq -r '.pr_url' release-info/release-info.json)
          release_version=$(jq -r '.release_version' release-info/release-info.json)
          
          echo "Extracted thread info:"
          echo "  Channel ID: $channel_id"
          echo "  Thread TS: $thread_ts"
          echo "  PR URL: $pr_url"
          echo "  Release Version: $release_version"
          
          # Set outputs for use in subsequent steps
          echo "channel_id=$channel_id" >> $GITHUB_OUTPUT
          echo "thread_ts=$thread_ts" >> $GITHUB_OUTPUT
          echo "pr_url=$pr_url" >> $GITHUB_OUTPUT
          echo "has_thread_info=true" >> $GITHUB_OUTPUT
        else
          echo "No release info artifact found"
          echo "has_thread_info=false" >> $GITHUB_OUTPUT
        fi

    - name: Extract deployment message URL
      id: extract-message-url
      if: ${{ steps.extract-info.outputs.has_thread_info == 'true' }}
      shell: bash
      continue-on-error: true
      env:
        SLACK_API_RESPONSE: ${{ inputs.slack_api_response }}
        SLACK_MESSAGE_URL: ${{ inputs.slack_message_url }}
      run: |
        # Use provided slack_message_url if available, otherwise extract from slack_api_response

        if [ -n "$SLACK_MESSAGE_URL" ] && [ "$SLACK_MESSAGE_URL" != "null" ]; then
          echo "Using provided Slack message URL: $SLACK_MESSAGE_URL"
          echo "message_url=$SLACK_MESSAGE_URL" >> $GITHUB_OUTPUT
        elif [ -n "$SLACK_API_RESPONSE" ] && [ "$SLACK_API_RESPONSE" != "null" ]; then
          echo "Extracting message URL from Slack API response..."

          # Check if response is valid JSON and contains required fields
          if echo "$SLACK_API_RESPONSE" | jq -e '.ok and .channel and .ts' > /dev/null 2>&1; then
            # Get channel and timestamp from response
            channel=$(echo "$SLACK_API_RESPONSE" | jq -r '.channel')
            ts=$(echo "$SLACK_API_RESPONSE" | jq -r '.ts')

            # Construct message URL
            # Format: https://workspace.slack.com/archives/CHANNEL/pTIMESTAMP
            # Convert timestamp 1640995200.123456 to p1640995200123456
            ts_for_url=$(echo "$ts" | tr -d '.')
            message_url="https://rudderlabs.slack.com/archives/${channel}/p${ts_for_url}"

            echo "Deployment message URL: $message_url"
            echo "message_url=$message_url" >> $GITHUB_OUTPUT
          else
            echo "Invalid or missing Slack response"
            echo "::warning title=Release thread notice skipped::invalid Slack API response; no message link to post"
            echo "- :warning: Release thread notice skipped: invalid Slack API response; no message link to post" >> "$GITHUB_STEP_SUMMARY"
            echo "message_url=" >> $GITHUB_OUTPUT
          fi
        else
          echo "No Slack message URL or API response provided"
          echo "::warning title=Release thread notice skipped::no Slack message URL or API response provided"
          echo "- :warning: Release thread notice skipped: no Slack message URL or API response provided" >> "$GITHUB_STEP_SUMMARY"
          echo "message_url=" >> $GITHUB_OUTPUT
        fi

    - name: Post deployment link to release thread
      id: post-notice
      if: ${{ steps.extract-info.outputs.has_thread_info == 'true' && steps.extract-message-url.outputs.message_url != '' }}
      uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52  # v2.1.0
      continue-on-error: true
      with:
        method: chat.postMessage
        token: ${{ inputs.slack_bot_token }}
        retries: rapid
        payload-templated: true
        payload: |
          {
            "channel": "${{ steps.extract-info.outputs.channel_id }}",
            "thread_ts": "${{ steps.extract-info.outputs.thread_ts }}",
            "text": "${{ inputs.title }}\n<${{ steps.extract-message-url.outputs.message_url }}|${{ inputs.link_text }}>\n\nCC: ${{ inputs.slack_slugs }}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*${{ inputs.title }}*${{ inputs.custom_message != '' && format('\n\n{0}', inputs.custom_message) || '' }}\n<${{ steps.extract-message-url.outputs.message_url }}|${{ inputs.link_text }}>\n\nCC: ${{ inputs.slack_slugs }}"
                }
              }
            ]
          }

    # The Slack action passes on API errors (errors: false), so check ok as well as outcome
    - name: Report release thread notice failures
      if: ${{ always() && (steps.download-release-info.outcome == 'failure' || steps.extract-info.outcome == 'failure' || steps.extract-message-url.outcome == 'failure' || (steps.post-notice.outcome != 'skipped' && steps.post-notice.outputs.ok != 'true')) }}
      shell: bash
      env:
        DOWNLOAD_OUTCOME: ${{ steps.download-release-info.outcome }}
        EXTRACT_OUTCOME: ${{ steps.extract-info.outcome }}
        MESSAGE_URL_OUTCOME: ${{ steps.extract-message-url.outcome }}
        POST_OUTCOME: ${{ steps.post-notice.outcome }}
        POST_RESPONSE: ${{ steps.post-notice.outputs.response }}
      run: |
        if [ "$DOWNLOAD_OUTCOME" = "failure" ] || [ "$EXTRACT_OUTCOME" = "failure" ] || [ "$MESSAGE_URL_OUTCOME" = "failure" ]; then
          reason="release info lookup errored (download: $DOWNLOAD_OUTCOME, extract: $EXTRACT_OUTCOME, message URL: $MESSAGE_URL_OUTCOME)"
        else
          slack_error=$(echo "$POST_RESPONSE" | jq -r '.error // empty' 2>/dev/null || true)
          reason="Slack chat.postMessage failed (${slack_error:-step $POST_OUTCOME})"
        fi
        echo "::warning title=Release thread notice failed::$reason"
        echo "- :warning: Release thread notice failed: $reason" >> "$GITHUB_STEP_SUMMARY"
